name: Integracion Continua

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

jobs:
  validaciones:
    name: Validar proyecto
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar calidad del codigo
        run: npm run lint

      - name: Ejecutar pruebas unitarias con cobertura
        run: npm run test:coverage

      - name: Validar compilacion
        run: npm run build

      - name: Analisis de calidad con SonarCloud
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=idrakenmune
            -Dsonar.projectKey=idrakenmune_AUY1102-Pipeline
            -Dsonar.sources=src
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

  snyk:
    name: Analisis de dependencias con Snyk
    runs-on: ubuntu-latest
    needs: validaciones

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Ejecutar Snyk para detectar vulnerabilidades criticas
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=critical

  docker:
    name: Construir, publicar y escanear imagen Docker
    runs-on: ubuntu-latest
    needs: validaciones

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y subir imagen a Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/auy1102-pipeline:latest

      - name: Analizar vulnerabilidades de la imagen con Docker Scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ secrets.DOCKERHUB_USERNAME }}/auy1102-pipeline:latest
          only-severities: critical,high
          exit-code: true
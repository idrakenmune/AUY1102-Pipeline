name: Integracion Continua

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

jobs:
  validaciones:
    name: Validar proyecto
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar calidad del codigo
        run: npm run lint

      - name: Ejecutar pruebas unitarias
        run: npm run test:unit

      - name: Validar compilacion
        run: npm run build


docker:
    name: Construir y publicar imagen Docker
    runs-on: ubuntu-latest
    needs: validaciones

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y subir imagen a Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/auy1102-pipeline:latest